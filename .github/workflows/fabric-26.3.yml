name: Fabric 26.3 migration diagnostics

on:
  push:
    branches: [fabric-26.3]

permissions:
  contents: read

concurrency:
  group: fabric-26.3-migration
  cancel-in-progress: false

jobs:
  import-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fabric-26.3
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Nostalgica-Reverie/Nostalgic-Tweaks
          ref: 58bf1d2b6ec336cc6547507f525ad0c89e7326f1
          path: .upstream-port-source
          persist-credentials: false
      - name: Import pinned common and Fabric source trees
        run: python3 tools/import_port_sources.py .upstream-port-source
      - name: Commit imported sources to fabric-26.3 only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src fabric gradle.properties PORT_SOURCE.json .gitignore
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Import pinned 26.1.x sources as unverified Fabric 26.3 migration candidate'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fabric-26.3

  compile-candidate:
    needs: import-sources
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fabric-26.3
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile candidate (not a runtime compatibility test)
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain build --stacktrace 2>&1 | tee port-build.log
      - name: Save compiler diagnostics and any candidate jars
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.3-unverified-candidate-and-diagnostics
          if-no-files-found: warn
          path: |
            port-build.log
            build/reports/
            build/libs/
